services:
  lucy-web:
    build: .
    container_name: lucy_web
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AI_API_URL=${AI_API_URL}
      - API_SECRET=${API_SECRET}
    networks:
      - default
      - postgresql_default

networks:
  postgresql_default:
    external: true
